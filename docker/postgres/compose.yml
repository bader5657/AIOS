services:
  postgres:
    image: postgres:17-alpine
    container_name: aios-postgres

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./data:/var/lib/postgresql/data

    networks:
      - aios-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aios-net:
    external: true
